min_version = "2026.8.0"

[tools]
node = "24"
java = "temurin-21"
glab = "latest"
opentofu = "latest"
uv = "latest"
age = "latest"

[bootstrap.packages]
"brew:fish" = { os = "macos" }
"apt:fish" = { os = "linux" }

[dotfiles]
"~/.dotfiles" = { source = "~/.local/share/mise/bootstrap-repo" }
"~/.config/mise/config.toml" = { source = "~/.local/share/mise/bootstrap-repo/.config/mise/config.toml" }
"~/.config/fish" = { source = "~/.local/share/mise/bootstrap-repo/.config/fish", mode = "symlink-each", manifest = "git" }
"~/.gitconfig" = { source = "~/.local/share/mise/bootstrap-repo/.gitconfig" }
"~/.screenrc" = { source = "~/.local/share/mise/bootstrap-repo/.screenrc" }
"~/.ssh/config" = { source = "~/.local/share/mise/bootstrap-repo/.ssh/config" }
"~/.ssh/config.d" = { source = "~/.local/share/mise/bootstrap-repo/.ssh/config.d", mode = "symlink-each", manifest = "git" }
"~/.vimrc" = { source = "~/.local/share/mise/bootstrap-repo/.vimrc" }
"~/.zshrc" = { source = "~/.local/share/mise/bootstrap-repo/.zshrc" }
